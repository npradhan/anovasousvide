[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anova-web"
version = "0.1.0"
description = "Web control panel for the Anova Precision Cooker (Bluetooth), ported from Aldaviva/SousVide"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.22",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
anova-web = "anova_web.__main__:main"

[tool.setuptools]
packages = ["anova_web"]

[tool.setuptools.package-data]
anova_web = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
